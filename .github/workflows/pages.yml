# Generated from kakurai49/sandbox projects/pages-release/templates/pages.yml.
# Update the common source and run tools/sync_sites.py; do not edit this copy.
name: pages build and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: voicy-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    outputs:
      pages-artifact-name: ${{ steps.release.outputs.pages }}
      evidence-artifact-name: ${{ steps.release.outputs.evidence }}
      artifact-sha256: ${{ steps.release.outputs.artifact_sha256 }}
      manifest-sha256: ${{ steps.release.outputs.manifest_sha256 }}
      pages-artifact-id: ${{ steps.pages.outputs.artifact-id }}
      pages-artifact-digest: ${{ steps.pages.outputs.artifact-digest }}
      evidence-artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      build-run-attempt: ${{ steps.release.outputs.build_run_attempt }}
      build-repository: ${{ steps.release.outputs.build_repository }}
      build-source-sha: ${{ steps.release.outputs.build_source_sha }}
      build-run-id: ${{ steps.release.outputs.build_run_id }}
      build-ref: ${{ steps.release.outputs.build_ref }}
      build-event-name: ${{ steps.release.outputs.build_event_name }}
      build-environment: ${{ steps.release.outputs.build_environment }}
      storage-admission: ${{ steps.release.outputs.storage_admission }}
      upload-authorized: ${{ steps.release.outputs.upload_authorized }}
      audit-observed-at: ${{ steps.release.outputs.audit_observed_at }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'

      - name: Verify the installed common package and workflow
        run: python .github/pages-core/security.py verify-vendor --root .

      - name: Install the complete locked validation environment
        run: |
          python -m venv "$RUNNER_TEMP/pages-env"
          "$RUNNER_TEMP/pages-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/pages-core/requirements.lock

      - name: Test the site publication boundary
        run: |
          "$RUNNER_TEMP/pages-env/bin/python" -m unittest discover -s .github/pages -p 'test_*.py' -v

      - name: Build twice and inventory the exact public bytes
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/pages_core.py build
          --root . --profile .github/pages/site.json
          --output "$RUNNER_TEMP/pages-release"
          --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Validate both SBOMs with the pinned official CycloneDX schema
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/security.py schema
          --output "$RUNNER_TEMP/pages-release"

      - name: Audit every installed Python distribution with OSV
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/security.py audit
          --output "$RUNNER_TEMP/pages-release"

      - name: Require all evidence to match this build before publication
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/pages_core.py gate
          --output "$RUNNER_TEMP/pages-release"
          --schema-receipt "$RUNNER_TEMP/pages-release/schema-validation.json"
          --audit-receipt "$RUNNER_TEMP/pages-release/vulnerability-audit.json"

      - name: Rehearse the complete Pages admission without authorizing upload
        if: github.event_name == 'pull_request'
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/security.py pages-rehearsal
          --root . --profile .github/pages/site.json
          --output "$RUNNER_TEMP/pages-release" --environment github-pages

      - name: Admit this exact production run under the Pages storage policy
        if: github.event_name != 'pull_request'
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/security.py pages-admission
          --root . --profile .github/pages/site.json
          --output "$RUNNER_TEMP/pages-release" --environment github-pages

      - name: Check the exact evidence file budget
        run: >-
          "$RUNNER_TEMP/pages-env/bin/python" .github/pages-core/security.py evidence-budget
          --output "$RUNNER_TEMP/pages-release"

      - name: Bind outputs and summarize the verified build
        id: release
        run: |
          "$RUNNER_TEMP/pages-env/bin/python" - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pages-release'
          binding = json.loads((root / 'binding.json').read_text())
          validation = json.loads((root / 'validation.json').read_text())
          audit = json.loads((root / 'vulnerability-audit.json').read_text())
          admission = json.loads((root / 'pages-storage-admission.json').read_text())
          rehearsal = os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
          assert binding['repository'] == os.environ['GITHUB_REPOSITORY'] == 'kakurai49/voicy'
          assert binding['site'] == 'voicy'
          assert binding['source_sha'] == os.environ['GITHUB_SHA']
          assert binding['run_id'] == os.environ['GITHUB_RUN_ID']
          assert binding['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert admission['status'] == 'PASS' and admission['binding'] == binding
          assert admission['mode'] == ('rehearsal' if rehearsal else 'production')
          assert admission['upload_authorized'] is (not rehearsal)
          assert validation['deployment_eligible'] is (not rehearsal)
          if not rehearsal:
              assert os.environ['GITHUB_REF'] == 'refs/heads/main'
              assert os.environ['GITHUB_EVENT_NAME'] in {'push', 'workflow_dispatch'}
          suffix = binding['run_id'] + '-' + binding['run_attempt']
          outputs = {
              'pages': 'github-pages-' + suffix, 'evidence': 'pages-evidence-' + suffix,
              'artifact_sha256': binding['artifact_sha256'], 'manifest_sha256': binding['manifest_sha256'],
              'build_run_attempt': binding['run_attempt'], 'build_run_id': binding['run_id'],
              'build_source_sha': binding['source_sha'], 'build_repository': binding['repository'],
              'build_ref': os.environ['GITHUB_REF'], 'build_event_name': os.environ['GITHUB_EVENT_NAME'],
              'build_environment': 'github-pages', 'storage_admission': admission['status'],
              'upload_authorized': str(admission['upload_authorized']).lower(),
              'audit_observed_at': audit['observed_at'],
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in outputs.items():
                  assert '\n' not in value and '\r' not in value
                  out.write(key + '=' + value + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Verified Pages build\n\n```json\n')
              out.write(json.dumps({'binding': binding, 'validation': validation, 'storage_admission': admission}, indent=2))
              out.write('\n```\n\nThe audit covers installed Python distributions. Interpreter, OS, Actions and first-party code assessment limits remain recorded.\n')
              if rehearsal:
                  out.write('PR admission rehearsal passed without upload authority. Production must pass the same rules with its actual main/run/attempt identity.\n')
              else:
                  out.write('The exact public archive passed the approved Pages-only policy. Deployment still requires the intended GitHub Pages and Environment configuration.\n')
          PYTHON

      # Only an actual approved main run may upload; PR rehearsal never grants authority.
      # The ZIP transport contains exactly the already-validated canonical artifact.tar.
      - name: Upload the exact validated Pages tar
        id: pages
        if: >-
          steps.release.outputs.upload_authorized == 'true' &&
          github.repository == 'kakurai49/voicy' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.pages }}
          path: ${{ runner.temp }}/pages-release/artifact.tar
          archive: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 1
          overwrite: false

      - name: Keep only named release evidence outside the public site
        id: evidence
        if: >-
          steps.release.outputs.upload_authorized == 'true' &&
          github.repository == 'kakurai49/voicy' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.evidence }}
          path: |
            ${{ runner.temp }}/pages-release/binding.json
            ${{ runner.temp }}/pages-release/release-manifest.json
            ${{ runner.temp }}/pages-release/build.cdx.json
            ${{ runner.temp }}/pages-release/browser-runtime.cdx.json
            ${{ runner.temp }}/pages-release/provenance.json
            ${{ runner.temp }}/pages-release/validation.json
            ${{ runner.temp }}/pages-release/schema-validation.json
            ${{ runner.temp }}/pages-release/vulnerability-audit.json
            ${{ runner.temp }}/pages-release/pages-storage-admission.json
          archive: true
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  deploy:
    name: deploy
    needs: build
    if: >-
      needs.build.outputs.upload-authorized == 'true' &&
      github.repository == 'kakurai49/voicy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployment-outcome: ${{ steps.deployment.outcome }}
      receipt-outcome: ${{ steps.receipt.outcome }}
      receipt-upload-outcome: ${{ steps.receipt_upload.outcome }}
    steps:
      # No checkout, repository script, package install, or rebuild in this job.
      - name: Require a fresh audit and a build from this same run attempt
        id: preflight
        env:
          BUILD_REPOSITORY: ${{ needs.build.outputs.build-repository }}
          BUILD_SOURCE_SHA: ${{ needs.build.outputs.build-source-sha }}
          BUILD_RUN_ID: ${{ needs.build.outputs.build-run-id }}
          BUILD_RUN_ATTEMPT: ${{ needs.build.outputs.build-run-attempt }}
          BUILD_REF: ${{ needs.build.outputs.build-ref }}
          BUILD_EVENT_NAME: ${{ needs.build.outputs.build-event-name }}
          BUILD_ENVIRONMENT: ${{ needs.build.outputs.build-environment }}
          STORAGE_ADMISSION: ${{ needs.build.outputs.storage-admission }}
          UPLOAD_AUTHORIZED: ${{ needs.build.outputs.upload-authorized }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.pages-artifact-name }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.pages-artifact-digest }}
          TAR_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          AUDIT_OBSERVED_AT: ${{ needs.build.outputs.audit-observed-at }}
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime, timezone
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          for key in ('REPOSITORY', 'SOURCE_SHA', 'RUN_ID', 'RUN_ATTEMPT', 'REF', 'EVENT_NAME'):
              github_key = 'GITHUB_SHA' if key == 'SOURCE_SHA' else 'GITHUB_' + key
              require(os.environ['BUILD_' + key] == os.environ[github_key], 'Build context mismatch: ' + key)
          require(os.environ['GITHUB_REPOSITORY'] == 'kakurai49/voicy', 'Unexpected repository.')
          require(os.environ['GITHUB_REF'] == 'refs/heads/main', 'Only main can deploy.')
          require(os.environ['GITHUB_EVENT_NAME'] in {'push', 'workflow_dispatch'}, 'Unexpected deployment event.')
          require(os.environ['BUILD_ENVIRONMENT'] == 'github-pages', 'Unexpected deployment environment.')
          require(os.environ['STORAGE_ADMISSION'] == 'PASS' and os.environ['UPLOAD_AUTHORIZED'] == 'true',
                  'Production Pages storage admission is required.')
          require(re.fullmatch(r'[a-f0-9]{40}', os.environ['GITHUB_SHA']), 'Invalid source SHA.')
          require(re.fullmatch(r'[1-9][0-9]*', os.environ['ARTIFACT_ID']), 'Missing immutable artifact ID.')
          require(os.environ['ARTIFACT_NAME'] == 'github-pages-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
                  'Artifact name does not belong to this run attempt.')
          for key in ('ARTIFACT_DIGEST', 'TAR_SHA256', 'MANIFEST_SHA256'):
              require(re.fullmatch(r'[a-f0-9]{64}', os.environ[key].removeprefix('sha256:')), 'Missing artifact hash: ' + key)
          observed = datetime.fromisoformat(os.environ['AUDIT_OBSERVED_AT'].replace('Z', '+00:00'))
          require(observed.tzinfo is not None and 0 <= (datetime.now(timezone.utc) - observed).total_seconds() <= 86400,
                  'Dependency audit is not fresh. Re-run all jobs before deployment.')
          PY

      - name: Require the intended Pages configuration and immutable artifact identity
        id: configuration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.pages-artifact-name }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.pages-artifact-digest }}
        with:
          script: |
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner, repo: context.repo.repo
            });
            if (pages.build_type !== 'workflow' || pages.html_url !== 'https://kakurai49.github.io/voicy/') {
              throw new Error('Pages Source must be GitHub Actions at the intended destination. Complete the migration before merging.');
            }
            const { data: artifact } = await github.rest.actions.getArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: Number(process.env.ARTIFACT_ID)
            });
            const digest = value => String(value || '').replace(/^sha256:/, '');
            if (String(artifact.id) !== process.env.ARTIFACT_ID || artifact.name !== process.env.ARTIFACT_NAME ||
                artifact.expired !== false || !Number.isSafeInteger(artifact.size_in_bytes) ||
                artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 5000000 ||
                digest(artifact.digest) !== digest(process.env.ARTIFACT_DIGEST) ||
                String(artifact.workflow_run?.id) !== String(context.runId) ||
                artifact.workflow_run?.head_sha !== context.sha || artifact.workflow_run?.head_branch !== 'main' ||
                artifact.workflow_run?.repository_id !== context.payload.repository.id ||
                artifact.workflow_run?.head_repository_id !== context.payload.repository.id) {
              throw new Error('Pages artifact metadata does not match this build and main run.');
            }

      - name: Download the exact Pages artifact by immutable ID
        id: artifact_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.pages-artifact-id }}
          path: ${{ runner.temp }}/pages-before-deploy
          merge-multiple: true
          digest-mismatch: error

      - name: Verify the downloaded canonical tar before deployment
        id: tar_verification
        env:
          EXPECTED_TAR_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os, stat
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'pages-before-deploy'
          if directory.is_symlink() or not directory.is_dir() or sorted(p.name for p in directory.iterdir()) != ['artifact.tar']:
              raise SystemExit('The Pages transport must contain exactly artifact.tar.')
          artifact = directory / 'artifact.tar'
          metadata = artifact.lstat()
          if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or not 0 < metadata.st_size <= 5000000:
              raise SystemExit('The Pages artifact is not a bounded regular file.')
          with artifact.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != os.environ['EXPECTED_TAR_SHA256']:
              raise SystemExit('Downloaded Pages tar differs from the admitted build.')
          PY

      - name: Deploy only this successful build attempt
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.pages-artifact-name }}

      - name: Record deployment identity separately from verification
        id: receipt
        if: always()
        timeout-minutes: 1
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.artifact_download.outcome }}
          TAR_VERIFICATION_OUTCOME: ${{ steps.tar_verification.outcome }}
          ARTIFACT_NAME: ${{ needs.build.outputs.pages-artifact-name }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.pages-artifact-digest }}
          TAR_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def value(name):
              return os.environ.get(name) or None
          def outcome(name):
              observed = value(name)
              return observed if observed in {'success', 'failure', 'cancelled', 'skipped'} else None
          deployment = outcome('DEPLOYMENT_OUTCOME')
          predeployment = {name: outcome(name.upper() + '_OUTCOME') for name in
                           ('preflight', 'configuration', 'artifact_download', 'tar_verification')}
          failed_stage = next((name for name, result in predeployment.items()
                               if result in {'failure', 'cancelled'}), None)
          if deployment == 'success':
              error_class, error_summary = None, None
          elif deployment in {'failure', 'cancelled'}:
              failed_stage = 'deployment'
              error_class = 'deployment_' + deployment
              error_summary = 'The deployment action reported ' + deployment + '; inspect its job log.'
          elif deployment == 'skipped' and failed_stage:
              error_class = 'predeployment_' + predeployment[failed_stage]
              error_summary = 'Deployment was not attempted after ' + failed_stage + '.'
          elif deployment == 'skipped':
              error_class, error_summary = 'deployment_not_attempted', 'The deployment action was skipped.'
          else:
              error_class, error_summary = 'deployment_outcome_unavailable', 'The deployment action outcome was unavailable.'
          status = {'success': 'DEPLOYED_NOT_HTTP_VERIFIED', 'failure': 'DEPLOYMENT_FAILED',
                    'cancelled': 'DEPLOYMENT_CANCELLED', 'skipped': 'DEPLOYMENT_NOT_ATTEMPTED'}
          receipt = {
              'schema': 'pages-deployment/v1', 'status': status.get(deployment, 'OUTCOME_UNAVAILABLE'),
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'repository': value('GITHUB_REPOSITORY'), 'source_sha': value('GITHUB_SHA'),
              'ref': value('GITHUB_REF'), 'event': value('GITHUB_EVENT_NAME'),
              'workflow_ref': value('GITHUB_WORKFLOW_REF'),
              'run_id': value('GITHUB_RUN_ID'), 'run_attempt': value('GITHUB_RUN_ATTEMPT'),
              'deployment_step_outcome': deployment,
              'deploy_job_status_at_recording': outcome('DEPLOY_JOB_STATUS'),
              'predeployment_outcomes': predeployment,
              'deployment_id': None, 'deployment_id_unavailable_reason': 'action_output_unavailable',
              'artifact_name': value('ARTIFACT_NAME'), 'artifact_id': value('ARTIFACT_ID'),
              'artifact_digest': value('ARTIFACT_DIGEST'), 'tar_sha256': value('TAR_SHA256'),
              'manifest_sha256': value('MANIFEST_SHA256'), 'page_url': value('PAGE_URL'),
              'expected_page_url': 'https://kakurai49.github.io/voicy/', 'http_verification': 'NOT_RECORDED_HERE',
              'failed_stage': failed_stage, 'error_class': error_class, 'error_summary': error_summary,
          }
          raw = (json.dumps(receipt, indent=2) + '\n').encode()
          assert len(raw) <= 100000
          (Path(os.environ['RUNNER_TEMP']) / 'deployment.json').write_bytes(raw)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Deployment receipt\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          print(json.dumps(receipt))
          PY

      - name: Retain the small deployment receipt
        id: receipt_upload
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment.json
          archive: true
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  verify:
    name: verify
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      checkout-outcome: ${{ steps.checkout.outcome }}
      evidence-download-outcome: ${{ steps.evidence_download.outcome }}
      manifest-http-outcome: ${{ steps.manifest_http.outcome }}
    steps:
      - name: Check out the same event commit without saved credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download the exact evidence artifact by immutable ID
        id: evidence_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.evidence-artifact-id }}
          path: ${{ runner.temp }}/pages-evidence
          merge-multiple: true
          digest-mismatch: error

      - name: Match manifest identity and verify every served byte
        id: manifest_http
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          EXPECTED_TAR_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, time
          from pathlib import Path
          path = Path('.github/pages-core/pages_core.py')
          spec = importlib.util.spec_from_file_location('pages_core', path)
          core = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(core)
          directory = Path(os.environ['RUNNER_TEMP']) / 'pages-evidence'
          raw = (directory / 'release-manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_MANIFEST_SHA256']
          manifest = json.loads(raw)
          assert manifest['repository'] == os.environ['GITHUB_REPOSITORY']
          assert manifest['source_sha'] == os.environ['GITHUB_SHA']
          assert manifest['run_id'] == os.environ['GITHUB_RUN_ID']
          assert manifest['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert manifest['artifact']['sha256'] == os.environ['EXPECTED_TAR_SHA256']
          for attempt in range(3):
              try:
                  receipt = core.verify_http(manifest, 'https://kakurai49.github.io/voicy/', timeout=10)
                  break
              except (core.ReleaseError, OSError) as exc:
                  if attempt == 2:
                      receipt = {'schema': 'pages-verification/v1', 'status': 'FAIL', 'error': str(exc)}
                  else:
                      time.sleep(15)
          (directory / 'verification.json').write_bytes(core.json_bytes(receipt))
          assert (directory / 'verification.json').stat().st_size <= 100000
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Public HTTP verification\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          if receipt['status'] != 'PASS':
              raise SystemExit(1)
          PY

      - name: Retain the small HTTP verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-evidence/verification.json
          archive: true
          if-no-files-found: warn
          retention-days: 1
          overwrite: false

  status:
    name: status
    needs: [build, deploy, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # This job reports results without publication or artifact-upload actions.
      - name: Summarize every stage including skipped jobs
        if: always()
        timeout-minutes: 1
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOYMENT_OUTCOME: ${{ needs.deploy.outputs.deployment-outcome }}
          RECEIPT_OUTCOME: ${{ needs.deploy.outputs.receipt-outcome }}
          RECEIPT_UPLOAD_OUTCOME: ${{ needs.deploy.outputs.receipt-upload-outcome }}
          VERIFY_CHECKOUT_OUTCOME: ${{ needs.verify.outputs.checkout-outcome }}
          VERIFY_DOWNLOAD_OUTCOME: ${{ needs.verify.outputs.evidence-download-outcome }}
          VERIFY_MANIFEST_HTTP_OUTCOME: ${{ needs.verify.outputs.manifest-http-outcome }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.pages-artifact-digest }}
          TAR_SHA256: ${{ needs.build.outputs.artifact-sha256 }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          def value(name):
              return os.environ.get(name) or None
          def outcome(name):
              observed = value(name)
              return observed if observed in {'success', 'failure', 'cancelled', 'skipped'} else None
          report = {
              'schema': 'pages-run-summary/v1', 'observed_at': datetime.now(timezone.utc).isoformat(),
              'repository': value('GITHUB_REPOSITORY'), 'source_sha': value('GITHUB_SHA'),
              'ref': value('GITHUB_REF'), 'event': value('GITHUB_EVENT_NAME'),
              'workflow_ref': value('GITHUB_WORKFLOW_REF'),
              'run_id': value('GITHUB_RUN_ID'), 'run_attempt': value('GITHUB_RUN_ATTEMPT'),
              'jobs': {name: outcome(name.upper() + '_RESULT') for name in ('build', 'deploy', 'verify')},
              'deployment_step_outcome': outcome('DEPLOYMENT_OUTCOME'),
              'deployment_receipt': {'generation': outcome('RECEIPT_OUTCOME'),
                                     'upload': outcome('RECEIPT_UPLOAD_OUTCOME')},
              'verification_steps': {'checkout': outcome('VERIFY_CHECKOUT_OUTCOME'),
                                     'evidence_download': outcome('VERIFY_DOWNLOAD_OUTCOME'),
                                     'manifest_and_http': outcome('VERIFY_MANIFEST_HTTP_OUTCOME')},
              'artifact_id': value('ARTIFACT_ID'), 'artifact_digest': value('ARTIFACT_DIGEST'),
              'tar_sha256': value('TAR_SHA256'), 'manifest_sha256': value('MANIFEST_SHA256'),
          }
          raw = json.dumps(report, indent=2)
          assert len(raw.encode()) <= 100000
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Pages stage outcomes\n\n```json\n' + raw + '\n```\n\n')
              out.write('Skipped jobs are not deployment or HTTP verification success. Missing step outcomes are null.\n\n')
              out.write('This summary creates no artifact. Deployment receipts expire after one day. If the runner cannot finish, use the Actions run/job API; receipt storage is not guaranteed.\n')
          print(raw)
          PY
